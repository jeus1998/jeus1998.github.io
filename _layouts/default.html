<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 바로가기</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 홈"><span class="brand-mark">J.</span><span>{{ site.title }}</span></a>
      <nav aria-label="주 메뉴">
        <a href="{{ '/' | relative_url }}">글</a>
        <a href="{{ '/about/' | relative_url }}">소개</a>
        <a href="{{ '/admin/' | relative_url }}">글쓰기</a>
        <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
  <main id="main" class="page-shell">{{ content }}</main>
  <footer class="site-footer">
    <div class="footer-inner"><span>© {{ 'now' | date: '%Y' }} {{ site.author.name }} · 꾸준히 기록하기</span><a href="{{ '/' | relative_url }}">처음으로 ↑</a></div>
  </footer>
</body>
</html>
