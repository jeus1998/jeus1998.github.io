backend:
  name: turbo-github
  # Site ID from the Decap Turbo dashboard.
  turbo_site_id: 505a9f15-42dd-439b-a05d-e5768d9d4b9a
  branch: main

site_url: https://jeus1998.github.io
display_url: https://jeus1998.github.io
locale: ko
publish_mode: simple

media_folder: assets/images
public_folder: /assets/images
media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 82
  strip_metadata: true
  width: 1600
  height: null

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: posts
    label: 글
    label_singular: 글
    folder: _posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    slug_collision: suffix
    media_folder: "assets/images/{{year}}/{{month}}/{{day}}/{{slug}}"
    public_folder: "/assets/images/{{year}}/{{month}}/{{day}}/{{slug}}"
    fields:
      - label: 레이아웃
        name: layout
        widget: hidden
        default: post
      - label: 제목
        name: title
        widget: string
      - label: 게시 날짜
        name: date
        widget: datetime
        format: "YYYY-MM-DD HH:mm:ss ZZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
      - label: 분류
        name: categories
        widget: list
        required: false
      - label: 태그
        name: tags
        widget: list
        required: false
      - label: 한 줄 소개
        name: description
        widget: text
        required: false
      - label: 본문 (Markdown)
        name: body
        widget: richtext
        modes: [raw]
        editor_components: [image, code-block]
        hint: 'Markdown을 직접 작성하세요. 이미지 파일을 이 편집 영역으로 끌어 놓거나, 이미지 삽입 도구를 사용하세요. 예: ![설명](/assets/images/경로/파일.webp)'
