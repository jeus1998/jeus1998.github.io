name: Sync Notion and coding-test posts
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/notion_sync.py"
      - "_includes/category-tree.html"
      - "_layouts/categories.html"
      - "_layouts/category.html"
      - "_layouts/post.html"
      - "admin/config.yml"
      - "assets/css/style.css"
      - ".github/workflows/sync-notion.yml"
  workflow_dispatch:
    inputs:
      notion_page_id:
        description: "가져올 Notion 페이지 ID 하나 (선택 사항)"
        required: false
        type: string
        default: ""
      notion_page_ids:
        description: "여러 페이지 묶음: ID를 쉼표 또는 줄바꿈으로 구분"
        required: false
        type: string
        default: ""
      notion_batch_queue:
        description: "자동 실행할 후속 묶음 목록: 각 묶음은 | 로 구분 (내부 사용)"
        required: false
        type: string
        default: ""
      notion_repair_collisions:
        description: "Notion ID 접두어 충돌로 누락된 페이지 복구"
        required: false
        type: boolean
        default: false
      notion_collision_offset:
        description: "충돌 복구 대기열 위치 (내부 사용)"
        required: false
        type: string
        default: "0"
  repository_dispatch:
    types: [coding-test-updated]
permissions:
  contents: write
  actions: write
concurrency:
  group: blog-content-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Notion dependency
        run: python -m pip install requests
      - name: Check Notion setup
        id: setup
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          if [ -n "$NOTION_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Notion import skipped; coding-test import will continue."
          fi
      - name: Import Notion pages
        if: github.event_name != 'repository_dispatch' && steps.setup.outputs.ready == 'true'
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_ROOT_PAGE_ID: d19bec251d44498c8c53ac994966d82d
          NOTION_PAGE_ID: ${{ inputs.notion_page_id || '' }}
          NOTION_PAGE_IDS: ${{ inputs.notion_page_ids }}
          NOTION_REPAIR_COLLISIONS: ${{ inputs.notion_repair_collisions }}
          NOTION_COLLISION_OFFSET: ${{ inputs.notion_collision_offset }}
        run: python scripts/notion_sync.py
      - name: Import coding-test solutions
        if: github.event_name == 'repository_dispatch'
        run: python scripts/coding_test_sync.py
      - name: Commit updated posts
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No content changes to publish."
          else
            git commit -m "Sync Notion and coding-test posts"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
      - name: Queue next Notion batch
        if: success() && github.event_name == 'workflow_dispatch' && inputs.notion_batch_queue != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_BATCH_QUEUE: ${{ inputs.notion_batch_queue }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/next-batch.json"
          import json, os
          batches = [line.strip() for line in os.environ["NOTION_BATCH_QUEUE"].split("|") if line.strip()]
          if batches:
              print(json.dumps({
                  "ref": "main",
                  "inputs": {
                      "notion_page_ids": batches[0],
                      "notion_batch_queue": "|".join(batches[1:]),
                  },
              }))
          PY
          if [ -s "$RUNNER_TEMP/next-batch.json" ]; then
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/sync-notion.yml/dispatches" \
              -d @"$RUNNER_TEMP/next-batch.json"
          fi
      - name: Queue next collision repair batch
        if: success() && github.event_name == 'workflow_dispatch' && inputs.notion_repair_collisions == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_COLLISION_OFFSET: ${{ inputs.notion_collision_offset }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/next-collision-batch.json"
          import json, os
          from pathlib import Path

          pages = json.loads(Path("_data/notion_sync_state.json").read_text(encoding="utf-8"))["pages"]
          groups = {}
          for page_id in pages:
              groups.setdefault(page_id[:16], []).append(page_id)
          collisions = [page_id for ids in groups.values() if len(ids) > 1 for page_id in ids]
          offset = int(os.environ.get("NOTION_COLLISION_OFFSET", "0") or "0")
          next_offset = offset + 25
          if next_offset < len(collisions):
              print(json.dumps({
                  "ref": "main",
                  "inputs": {
                      "notion_repair_collisions": "true",
                      "notion_collision_offset": str(next_offset),
                  },
              }))
          PY
          if [ -s "$RUNNER_TEMP/next-collision-batch.json" ]; then
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/sync-notion.yml/dispatches" \
              -d @"$RUNNER_TEMP/next-collision-batch.json"
          fi
