name: Sync Notion and coding-test posts
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/notion_sync.py"
      - "_includes/category-tree.html"
      - "_layouts/categories.html"
      - "_layouts/category.html"
      - "_layouts/post.html"
      - "admin/config.yml"
      - "assets/css/style.css"
      - ".github/workflows/sync-notion.yml"
  workflow_dispatch:
    inputs:
      notion_page_id:
        description: "이번 실행에서 가져올 Notion 페이지 ID (기본값은 첫 CS 글)"
        required: true
        type: string
        default: "26b7d6692ca881c29b94ed3e4f727d66"
  repository_dispatch:
    types: [coding-test-updated]
permissions:
  contents: write
  actions: write
concurrency:
  group: blog-content-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Notion dependency
        run: python -m pip install requests
      - name: Check Notion setup
        id: setup
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          if [ -n "$NOTION_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Notion import skipped; coding-test import will continue."
          fi
      - name: Import Notion pages
        if: github.event_name != 'repository_dispatch' && steps.setup.outputs.ready == 'true'
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_ROOT_PAGE_ID: d19bec251d44498c8c53ac994966d82d
          NOTION_PAGE_ID: ${{ inputs.notion_page_id || (github.event_name == 'push' && '26b7d6692ca881c29b94ed3e4f727d66') || '' }}
        run: python scripts/notion_sync.py
      - name: Import coding-test solutions
        if: github.event_name == 'repository_dispatch'
        run: python scripts/coding_test_sync.py
      - name: Commit updated posts
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No content changes to publish."
          else
            git commit -m "Sync Notion and coding-test posts"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
